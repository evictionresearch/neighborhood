url: ~
template:
  bootstrap: 5

reference:
  - title: HPRM responsible use
    desc: >
      The Do No Harm pledge that travels with every release of Housing
      Precarity Risk Model data. The HPRM is a tool for protection, not a
      market signal: it may not be used for real-estate prospecting or
      speculation, tenant screening, or to target vulnerable communities.
      Read this before using any HPRM function.
    contents:
      - nt_hprm_terms
  - title: Neighborhood typologies
    desc: Build and summarize tract-level racial/ethnic typologies.
    contents:
      - ntdf
      - ntcheck
      - nt_pal
  - title: Affordability index
    desc: Tract-level housing affordability relative to area median income.
    contents:
      - afford_index
      - afford_bands
      - afford_verdict
      - afford_capacity
      - afford_map
      - afford_caption
      - afford_entry
      - afford_zori
      - afford_stability
      - inflow_index
      - ami_cutoffs
      - hud_ami
      - afford
  - title: Mapping (MapLibre)
    desc: >
      Build interactive MapLibre GL maps of neighborhood data — choropleths,
      legends, labels, popups, and PMTiles. Built on Kyle Walker's mapgl.
    contents:
      - nt_map
      - nt_map_sync
      - nt_sync_maps
      - nt_declutter_basemap
      - nt_hprm_map
      - nt_hprm_pal
      - nt_maplibre
      - nt_terrain_style
      - nt_add_choropleth
      - nt_add_bivariate
      - nt_bivariate_pal
      - nt_add_labels
      - nt_layers_control
      - nt_popup
      - nt_pmtiles
  - title: Charts (interactive)
    desc: >
      Interactive editorial charts in the ERN "newspaper graphic" style where
      hovering reveals the y-axis. Built on John Coene's echarts4r. From trend
      lines and sparklines to ranked bars, disparity dumbbells, lollipops,
      composition bars, slope charts, scatter, and Du Bois-style waffle units.
    contents:
      - nt_chart
      - nt_spark
      - nt_bar
      - nt_lollipop
      - nt_dumbbell
      - nt_range
      - nt_stacked_bar
      - nt_slope
      - nt_scatter
      - nt_waffle
  - title: Static charts (ggplot2)
    desc: >
      A ggplot2 theme and color scales in the same ERN look, for reproducing the
      static (print/PDF) report and paper figures. ern_swatch() opens the titled
      sheet of every palette with WCAG contrast receipts.
    contents:
      - theme_ern
      - scale_ern
      - ern_palette
      - ern_swatch
  - title: State-profile page builders
    desc: >
      The inline-SVG charts and interactive shells of the ERN state-profile
      pages (evictionresearch.net/washington/ is the reference implementation),
      as raw-HTML string builders for the profiles' Quarto template. Emit them
      from `results: asis` chunks via nt_raw_html().
    contents:
      - nt_profile_trend_svg
      - nt_profile_yearly_svg
      - nt_profile_project_year
      - nt_profile_county_trend
      - nt_profile_county_trend_data
      - nt_profile_map_explorer
      - nt_profile_county_table
      - nt_profile_fourps_svg
      - nt_profile_race_trend_svg
      - nt_profile_race_ratio_svg
      - nt_profile_race_bars_svg
      - nt_profile_rent_trend_svg
      - nt_profile_rent_dumbbell_svg
      - nt_profile_monthly_js
      - nt_raw_html
  - title: Model reading aids
    desc: >
      Partial-dependence extraction and the ERN house-style dependence plot,
      for reading fitted models (bartMachine) behind the precarity maps.
    contents:
      - nt_pd_bart
      - nt_pd_plot
  - title: Geography utilities
    desc: >
      Crosswalks and cleaner tract maps — block-exact tract/place/ZIP weights,
      PUMA correspondence, water clipping, and boundary interpolation.
    contents:
      - get_co_puma
      - nt_areal_weight
      - nt_zcta_weights
      - nt_erase_water
      - nt_tract_interpolate
  - title: External data
    desc: Pull external datasets used in ERN work, cached locally.
    contents:
      - nt_apartmentlist_rents
  - title: File conversion
    desc: >
      Migrate legacy serialized data onto the house standard. Parquet is the
      on-disk format for analytic data because it is columnar, compressed, and
      readable from Python, Julia, and DuckDB, so a published number's data file
      outlives the R session that wrote it; .qs/.qs2 is fast but R-only.
    contents:
      - nt_qs_convert
  - title: Datasets
    contents:
      - us_nt_tracts2024
      - mn_evictions

articles:
  - title: Articles
    navbar: ~
    contents:
      - mapping-with-maplibre
      - interactive-charts
      - chart-gallery
      - state-profile-builders
      - ern-palettes
      - precarity-mapping
      - neighborhood-typologies
      - three-panes
      - affordability-index
      - geography-utilities
